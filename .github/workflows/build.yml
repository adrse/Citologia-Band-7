name: Build Citologia Band 7

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preparar projeto
        run: |
          mkdir app
          unzip -q citologia-band7-ready.zip -d app
          cd app
          echo "===== ARQUIVOS DO APP ====="
          ls -la
          echo ""
          echo "===== APP.JSON ====="
          cat app.json
          echo ""
          echo "===== PACKAGE.JSON ====="
          cat package.json

      - name: Instalar dependencias
        working-directory: app
        run: npm install

      - name: Instalar Zeus CLI
        run: npm install -g @zeppos/zeus-cli@1.8.2

      - name: Conferir ambiente
        run: |
          node -v
          npm -v
          zeus -v

      - name: Descobrir target
        id: target
        working-directory: app
        run: |
          TARGET=$(node -e "const app=require('./app.json'); console.log(Object.keys(app.targets)[0])")
          echo "Target encontrado: $TARGET"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Compilar aplicativo
        working-directory: app
        run: zeus build -t "${{ steps.target.outputs.target }}"

      - name: Mostrar resultado
        if: always()
        working-directory: app
        run: |
          echo "===== ARQUIVOS ====="
          ls -la
          echo ""
          echo "===== DIST ====="
          if [ -d dist ]; then
            find dist -maxdepth 3 -type f -print
          else
            echo "Pasta dist nao foi criada."
          fi

      - name: Salvar aplicativo compilado
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Citologia-Band-7
          path: app/dist/
          if-no-files-found: error